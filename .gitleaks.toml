# Gitleaks config for the secret-scan CI job. Extends the default ruleset;
# the allowlist below covers the repository's verified false-positive
# classes. Anything new the scanner reports is a real finding to triage,
# not an excuse to widen this list without looking.

[extend]
useDefault = true

[allowlist]
description = "Verified false positives"
paths = [
  # Historical-pipeline identity CSVs: UUID columns trip the generic-api-key
  # rule. The tree holds no credentials by design (synthetic-only rule).
  '''legacy_data/.*''',
  # Read-only legacy-site clone (the gitignored footbag_legacy_repo symlink).
  # The old footbag.org source legitimately holds the legacy site's clear-text
  # credentials; it is never committed, so git-mode scans already skip it, and a
  # working-tree or --no-git scan must skip it too rather than report the
  # legacy secrets.
  '''footbag_legacy_repo/.*''',
  # Curated email templates: long snake_case templateKey values (for example
  # honor_congratulation_bap_tier3) trip the generic-api-key rule. The tree
  # holds template text and keys only, no credentials by design.
  '''curated/email_templates/.*''',
  # Scanner output from local runs must never feed back into the scan.
  '''\.gitleaks-report\.json''',
]
regexes = [
  # Synthetic Stripe-shaped literals in the payments activation test; the
  # sk_test_/whsec_ prefixes are Stripe test-mode shapes with obviously
  # fake bodies.
  '''(sk_test|whsec)_synthetic\d+''',
  # Doc prose: a parameter name followed by '=' is not a key value.
  '''thumbnail_url=''',
  # Synthetic AWS-key-shaped literals in the operator-script tests, by the same
  # reasoning as the Stripe entry above: the bodies are fixed and obviously
  # fake. Two are Amazon's own documented example keys, two spell EXAMPLE
  # twice, and one is a zero-filled placeholder naming its role.
  #
  # Listed as exact bodies rather than as a path rule over tests/, deliberately.
  # A path rule would stop the scanner looking at those files at all, and a real
  # key pasted into one of them is exactly the accident worth catching there: a
  # push on 2026-09-20 went red on two of these very lines, which is the system
  # working. A real key cannot match any of these, because a real key's body is
  # random and these five are not.
  #
  # Anything AWS-shaped that is not one of these five is a finding to triage.
  # Adding a sixth synthetic key means adding it here on purpose.
  # AKIA is a long-lived access key id, ASIA a temporary session one. Both
  # prefixes appear in these tests and both are matched by the same rule.
  '''(AKIA|ASIA)(IOSFODNN7EXAMPLE|I44QH8DHBEXAMPLE|EXAMPLEEXAMPLE[0-9]{2}|EXISTINGKEY0+)''',
]
