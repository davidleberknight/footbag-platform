name: Action staleness

# Reports pinned GitHub Actions that have fallen behind their current release.
# It never edits a workflow: the bump stays a reviewed human change.
#
# Separate from CI on purpose. The check queries the GitHub API, and a rate
# limit or a network fault must never fail an ordinary build, so it runs on its
# own schedule instead of inside the convention gate. A failed run here is the
# notification: GitHub mails the maintainer when a scheduled workflow fails, and
# that mail is the whole alerting mechanism, because an action sitting on a
# runtime the platform is withdrawing raises no security advisory and so reaches
# no scanner, audit, or dependency alert.
#
# Scheduled workflows are suspended after a long stretch of repository
# inactivity, so a silent quarter means the check stopped rather than that
# everything is current. The same script runs by hand during routine security
# operations, which is the backstop.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staleness:
    name: Pinned action staleness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report pinned actions behind their current release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/check_action_staleness.sh
